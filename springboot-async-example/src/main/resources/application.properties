# BEGINNER:
# This is the `application.properties` file. Spring Boot applications use this file to set various configurations
# without having to write them directly in the Java code. Think of it as a settings panel for your application.
# For example, you could set the default port your web server runs on (e.g., `server.port=8081`).
# Spring Boot automatically reads this file when the application starts and applies the configurations.
# Lines starting with '#' are comments and are ignored by Spring Boot.

# INTERMEDIATE:
# The `application.properties` file is a standard way to provide externalized configuration to a Spring Boot application.
# Spring Boot uses a sophisticated mechanism to load properties from various sources (including this file, YAML files,
# environment variables, command-line arguments, etc.), with a defined order of precedence.
#
# Common categories of properties you might configure here include:
# - Server properties: `server.port`, `server.servlet.context-path`, `server.ssl.*`
# - Data source properties (if using a database): `spring.datasource.url`, `spring.datasource.username`, `spring.datasource.password`
# - Logging properties: `logging.level.root=WARN`, `logging.level.org.springframework=INFO`, `logging.file.name`
# - Spring MVC properties: `spring.mvc.view.prefix`, `spring.mvc.static-path-pattern`
# - Actuator endpoints: `management.endpoints.web.exposure.include=*`
# - Application-specific custom properties: You can define your own properties (e.g., `myapp.feature.enabled=true`)
#   and access them in your code using `@Value("${myapp.feature.enabled}")` or by binding them to a class
#   annotated with `@ConfigurationProperties`.

# ADVANCED:
# Property Overriding:
#   Spring Boot's externalized configuration follows a specific order of precedence. For example, environment variables
#   will override properties defined in this `application.properties` file. Command-line arguments have even higher precedence.
#   Profiles (`application-{profile}.properties`, e.g., `application-dev.properties`, `application-prod.properties`)
#   allow you to define profile-specific configurations. The active profile can be set via `spring.profiles.active` property or environment variable.
#
# YAML vs. Properties:
#   Instead of `.properties` files, you can use YAML (`.yml` or `.yaml`) files, which offer a more structured and hierarchical format.
#   Example:
#   spring:
#     application:
#       name: My App
#     datasource:
#       url: jdbc:mydb://localhost/test
#   Both formats are widely used; YAML is often preferred for complex configurations due to its readability.
#
# @ConfigurationProperties:
#   For type-safe access to a group of related properties, you can create a POJO class annotated with `@ConfigurationProperties("prefix")`.
#   Spring Boot will automatically bind properties starting with that prefix to the fields of the class.
#   Example:
#   @ConfigurationProperties("myapp.service")
#   public class MyAppServiceProperties {
#       private String apiKey;
#       private int timeout;
#       // getters and setters
#   }
#   Then, in `application.properties`:
#   myapp.service.api-key=your_api_key_here
#   myapp.service.timeout=5000

# --- Properties for Asynchronous Task Execution ---
# While this specific application (`springboot-async-example`) defines its TaskExecutor programmatically as a @Bean
# in `SpringbootAsyncApplication.java`, Spring Boot also allows configuring the default TaskExecutor via properties
# if you don't define a custom one or if you want to customize the auto-configured one.
# If an explicit `TaskExecutor` @Bean is defined (as in this project), these properties might not affect that specific bean
# unless it's designed to read them or if these properties influence the auto-configured fallback executor.
# However, they are standard Spring Boot properties for async task execution.

# BEGINNER: These settings help control how many background tasks can run at the same time.
# INTERMEDIATE: These properties configure the default ThreadPoolTaskExecutor that Spring Boot auto-configures
# if no custom TaskExecutor bean is defined and `@EnableAsync` is used.
# ADVANCED: These properties are used by `TaskExecutionProperties` to configure the auto-configured `ThreadPoolTaskExecutor`.
# If you have defined your own `ThreadPoolTaskExecutor` bean (like in this project), these properties
# typically do NOT directly configure your custom bean unless you explicitly bind them.
# They would apply to the default executor if your custom one wasn't primary or wasn't named "taskExecutor".

# spring.task.execution.pool.core-size=2
#   - BEGINNER: The number of "worker threads" to always keep ready for background tasks.
#   - INTERMEDIATE: The initial number of threads in the pool. These threads are created on demand until this size is reached.
#   - ADVANCED: Defines the core pool size for the task executor. Threads will be created up to this number as tasks arrive.
#     For I/O-bound tasks (like HTTP requests), this can be higher than the number of CPU cores.
#     For CPU-bound tasks, a value close to the number of cores is often optimal.
#     Default is 8.

# spring.task.execution.pool.max-size=8
#   - BEGINNER: The maximum number of "worker threads" that can be created if many background tasks come in at once.
#   - INTERMEDIATE: The maximum number of threads the pool can grow to. If `queue-capacity` is reached and `max-size`
#     is not yet reached, new threads will be created up to `max-size`.
#   - ADVANCED: Defines the maximum pool size. If the queue is full and `max-size` has not been reached,
#     the executor will create new threads. Be cautious with unbounded `max-size` (e.g., `Integer.MAX_VALUE`)
#     as it can lead to resource exhaustion if the queue is also unbounded or very large.
#     Default is `Integer.MAX_VALUE` if a queue capacity is configured, otherwise it's 8 (same as core-size if no queue).

# spring.task.execution.pool.queue-capacity=100
#   - BEGINNER: If all worker threads are busy, new tasks wait in a queue. This sets how many tasks can wait.
#   - INTERMEDIATE: The capacity of the queue that holds tasks before they are executed by a thread.
#     If the queue is full and `max-size` threads are active, new tasks will typically be rejected (depending on the rejection policy).
#   - ADVANCED: Defines the queue capacity for the `ThreadPoolTaskExecutor`.
#     - A bounded queue (like 100) can prevent resource exhaustion if tasks arrive faster than they can be processed.
#     - An unbounded queue (`Integer.MAX_VALUE`, the default if not set but `max-size` is greater than `core-size`)
#       means `max-size` may never be reached if `core-size` threads can't keep up, as tasks just queue up.
#     - A zero capacity queue (using `SynchronousQueue`) forces direct hand-off: if a thread is available, the task is given to it;
#       otherwise, a new thread is created up to `max-size`, or the task is rejected.
#     Default is `Integer.MAX_VALUE`.

# spring.task.execution.thread-name-prefix=my-async-task-
#   - BEGINNER: Gives a specific name prefix to the worker threads, making it easier to identify them in logs.
#   - INTERMEDIATE: Sets the prefix for thread names created by this executor pool. Useful for logging and debugging.
#   - ADVANCED: Customizes the thread names. This is very helpful for monitoring, profiling, and analyzing thread dumps
#     to understand which threads belong to which task executor.
#     Default is "task-".

# spring.task.execution.shutdown.await-termination=false
#   - ADVANCED: Whether to wait for scheduled tasks to complete on shutdown. Default is false.
#     Setting to `true` can be important for graceful shutdown, ensuring that pending async tasks are not abruptly terminated.
#     The custom bean in this project sets this via `executor.setWaitForTasksToCompleteOnShutdown(true);`.

# spring.task.execution.shutdown.await-termination-period=
#   - ADVANCED: The maximum_duration the application should wait for tasks to complete on shutdown if `await-termination` is true.
#     Example: `30s`. Default is not set, meaning it might wait indefinitely if tasks don't complete.

# Note: Since this project (springboot-async-example) defines a custom `ThreadPoolTaskExecutor` bean
# named "threadPoolTaskExecutor" and explicitly configures it in `SpringbootAsyncApplication.java`,
# the properties above would primarily affect the default auto-configured executor, not necessarily the custom one,
# unless the custom bean was designed to be configured by these properties (e.g. via @ConfigurationProperties).
# The custom bean in this project has hardcoded values:
# executor.setCorePoolSize(20);
# executor.setMaxPoolSize(1000);
# executor.setThreadNamePrefix("Async-");
# executor.setWaitForTasksToCompleteOnShutdown(true);
# These would take precedence for the "threadPoolTaskExecutor" bean.
